[project]
name = "orgcal"
version = "1.0.0"
description = "Synchronize org-mode files with a CalDAV server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "caldav>=1.3.9",
  "orgparse>=0.4.20231004",
  "pyyaml>=6.0.1",
]

[project.scripts]
orgcal = "orgcal.main:cli"

[dependency-groups]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.1",
  "pytest-cov>=6.2.1",
  "ruff>=0.15.0",
  "tox>=4.28.1",
  "types-pyyaml>=6.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["orgcal"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
python_classes = ["Test*"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "C4",
  "UP",
  "SIM",
]
ignore = [
  "E501",
]

[tool.tox]
env_list = ["fmt", "lint", "typecheck", "test"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
basepython = "python3.10"
uv = true
uv_sync = true
uv_resolution = "lowest-direct"
allowlist_externals = ["ruff", "mypy", "pytest"]

[tool.tox.env.fmt]
description = "Format code with ruff"
commands = [["ruff", "format", "src/", "tests/"]]

[tool.tox.env.lint]
description = "Lint code with ruff"
commands = [["ruff", "check", "src/", "tests/", "--fix"]]

[tool.tox.env.typecheck]
description = "Type-check with mypy"
commands = [["mypy", "src/orgcal/"]]

[tool.tox.env.test]
description = "Run tests with coverage"
commands = [
  [
    "pytest",
    "--cov=orgcal",
    "--cov-report=term-missing",
    "--cov-report=html",
    "tests/"
  ],
]

[tool.uv]
package = true
